name: Standalone owned scanner storage pair

on:
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'tools/InvoiceCompletionProducerAcceptance/companion/**'
      - '.github/workflows/financial-shared-pair-qualification.yml'

permissions:
  contents: read

concurrency:
  group: financial-shared-pair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  owned-pair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/scanner-shared-pair-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FINANCIAL_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      C821_COMPANION_PROFILE: HostedFinancialCompletionAcceptance
    steps:
      - name: Check out exact same-repository candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Execute held controls and original raw Git CLI
        shell: bash
        run: |
          python3 -I -B - raw-git <<'PY'
          import hashlib, os, stat, sys, types, unittest
          from pathlib import Path
          prefix = Path('tools/InvoiceCompletionProducerAcceptance/companion/scanner-shared-bridge')
          held = {}
          for name, expected in (('qualify_hosted_pair', '1cc6ce54d8317fe8ac21e9c3193d9e8d4ed225708f34c93a3e35f997081397c9'), ('test_hosted_pair_source', '00f7660188f76c3d069e846c52a468ce10e220e1b1a3fe6d8716b8bc0aa5a10d'), ('pair_failure_diagnostic', 'ef3b6a3d5238292738b03531206f608bb1c6c45d485c5640d4c03d44ba77d4ae'), ('pinned_image_oracle', 'da82d89cf595e9e2350f9a15c5e08b61f87c300bc1521d9ed4542400b21f3c5f'), ('held_pair_launcher', '4fc19580f9b36063e9808efc87e18bd1aa0ee5db955c15a9fee2f65eb419a8d9'), ('hosted_companion_resources', '58c1050a64b84096b84800a567fb7054d4915dd9f611ac1698b90513a392b26f'), ('borrowed_scanner_bridge', '751963c8a55666577b7802ecb1ce67ab651cf1c6b05373e02a57a5d91367f6d5'), ('hosted_scanner_readiness', '34f794ca4d05dcd8664fbb8a919975fd0864802bb0ecbd95edae9d67acbd63b6'), ('scanner_docker_command', '89daed400342a5d43a5c62bafbac50f024bf3ced95c6aa2d482d4e540b15a6d6'), ('owned_storage_backend', '09a1a03b2da2f10949f21d107d66130ff02e69060f43aa9dd4c01ad500133d24'), ('storage_owner_command', 'f91b5f7ec7db47407a37d047ca67db6687b7a5946d0ad835ef6d382df79c9219')):
              path = Path('tools/InvoiceCompletionProducerAcceptance/companion') / (name + '.py') if name in ('hosted_companion_resources','hosted_scanner_readiness','scanner_docker_command') else prefix / (name + '.py')
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or not 0 < before.st_size <= 1048576:
                      raise SystemExit('Pinned source acquisition refused')
                  data = bytearray()
                  while len(data) <= 1048576:
                      block = os.read(fd, min(65536, 1048577-len(data)))
                      if not block:
                          break
                      data.extend(block)
                  after = os.fstat(fd)
                  current = os.stat(path, follow_symlinks=False)
                  fields = lambda item: (item.st_dev, item.st_ino, item.st_size, item.st_mtime_ns)
                  if len(data) != before.st_size or fields(before) != fields(after) or fields(before) != fields(current) or hashlib.sha256(data).hexdigest() != expected:
                      raise SystemExit('Pinned source association refused')
                  held[name] = bytes(data)
              finally:
                  os.close(fd)
          for name in ('qualify_hosted_pair', 'test_hosted_pair_source'):
              module = types.ModuleType(name)
              module.__file__ = '<held-bootstrap:' + name + '>'
              sys.modules[name] = module
              exec(compile(held[name], module.__file__, 'exec'), module.__dict__)
          sys.modules['test_hosted_pair_source'].HELD_DIAGNOSTIC_SOURCE = held['pair_failure_diagnostic']
          sys.modules['test_hosted_pair_source'].HELD_OWNER_SOURCES = {name: held[name] for name in ('pinned_image_oracle', 'held_pair_launcher')}
          sys.modules['test_hosted_pair_source'].HELD_H_SOURCE = held['hosted_companion_resources']
          sys.modules['test_hosted_pair_source'].HELD_BRIDGE_SOURCE = held['borrowed_scanner_bridge']
          sys.modules['test_hosted_pair_source'].HELD_STORAGE_SOURCES = {'launcher':held['held_pair_launcher'], 'scanner':held['hosted_scanner_readiness'], 'runner':held['scanner_docker_command']}
          sys.modules['test_hosted_pair_source'].HELD_OBSERVER_SOURCES = {'storage':held['owned_storage_backend'], 'command':held['storage_owner_command']}
          result = unittest.TextTestRunner().run(unittest.defaultTestLoader.loadTestsFromModule(sys.modules['test_hosted_pair_source']))
          if result.testsRun != 46 or not result.wasSuccessful():
              raise SystemExit('Source controls refused')
          owner = sys.modules['qualify_hosted_pair']
          try:
              if sys.argv[1:] == ['raw-git']:
                  owner.raw_git_main()
              elif sys.argv[1:] == ['pair']:
                  owner.main()
              else:
                  raise SystemExit('Qualified mode refused')
          except BaseException as failure:
              try:
                  owner.write_failure_diagnostic(failure)
                  print('Standalone pair refused; unresolved original owners retained', file=sys.stderr)
              except BaseException:
                  pass
              finally:
                  owner.living_failure_fence()
              raise SystemExit(1)
          PY
      - name: Observe actual stopped-image oracle and original owned normal pair
        shell: bash
        run: |
          python3 -I -B - pair <<'PY'
          import hashlib, os, stat, sys, types, unittest
          from pathlib import Path
          prefix = Path('tools/InvoiceCompletionProducerAcceptance/companion/scanner-shared-bridge')
          held = {}
          for name, expected in (('qualify_hosted_pair', '1cc6ce54d8317fe8ac21e9c3193d9e8d4ed225708f34c93a3e35f997081397c9'), ('test_hosted_pair_source', '00f7660188f76c3d069e846c52a468ce10e220e1b1a3fe6d8716b8bc0aa5a10d'), ('pair_failure_diagnostic', 'ef3b6a3d5238292738b03531206f608bb1c6c45d485c5640d4c03d44ba77d4ae'), ('pinned_image_oracle', 'da82d89cf595e9e2350f9a15c5e08b61f87c300bc1521d9ed4542400b21f3c5f'), ('held_pair_launcher', '4fc19580f9b36063e9808efc87e18bd1aa0ee5db955c15a9fee2f65eb419a8d9'), ('hosted_companion_resources', '58c1050a64b84096b84800a567fb7054d4915dd9f611ac1698b90513a392b26f'), ('borrowed_scanner_bridge', '751963c8a55666577b7802ecb1ce67ab651cf1c6b05373e02a57a5d91367f6d5'), ('hosted_scanner_readiness', '34f794ca4d05dcd8664fbb8a919975fd0864802bb0ecbd95edae9d67acbd63b6'), ('scanner_docker_command', '89daed400342a5d43a5c62bafbac50f024bf3ced95c6aa2d482d4e540b15a6d6'), ('owned_storage_backend', '09a1a03b2da2f10949f21d107d66130ff02e69060f43aa9dd4c01ad500133d24'), ('storage_owner_command', 'f91b5f7ec7db47407a37d047ca67db6687b7a5946d0ad835ef6d382df79c9219')):
              path = Path('tools/InvoiceCompletionProducerAcceptance/companion') / (name + '.py') if name in ('hosted_companion_resources','hosted_scanner_readiness','scanner_docker_command') else prefix / (name + '.py')
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or not 0 < before.st_size <= 1048576:
                      raise SystemExit('Pinned source acquisition refused')
                  data = bytearray()
                  while len(data) <= 1048576:
                      block = os.read(fd, min(65536, 1048577-len(data)))
                      if not block:
                          break
                      data.extend(block)
                  after = os.fstat(fd)
                  current = os.stat(path, follow_symlinks=False)
                  fields = lambda item: (item.st_dev, item.st_ino, item.st_size, item.st_mtime_ns)
                  if len(data) != before.st_size or fields(before) != fields(after) or fields(before) != fields(current) or hashlib.sha256(data).hexdigest() != expected:
                      raise SystemExit('Pinned source association refused')
                  held[name] = bytes(data)
              finally:
                  os.close(fd)
          for name in ('qualify_hosted_pair', 'test_hosted_pair_source'):
              module = types.ModuleType(name)
              module.__file__ = '<held-bootstrap:' + name + '>'
              sys.modules[name] = module
              exec(compile(held[name], module.__file__, 'exec'), module.__dict__)
          sys.modules['test_hosted_pair_source'].HELD_DIAGNOSTIC_SOURCE = held['pair_failure_diagnostic']
          sys.modules['test_hosted_pair_source'].HELD_OWNER_SOURCES = {name: held[name] for name in ('pinned_image_oracle', 'held_pair_launcher')}
          sys.modules['test_hosted_pair_source'].HELD_H_SOURCE = held['hosted_companion_resources']
          sys.modules['test_hosted_pair_source'].HELD_BRIDGE_SOURCE = held['borrowed_scanner_bridge']
          sys.modules['test_hosted_pair_source'].HELD_STORAGE_SOURCES = {'launcher':held['held_pair_launcher'], 'scanner':held['hosted_scanner_readiness'], 'runner':held['scanner_docker_command']}
          sys.modules['test_hosted_pair_source'].HELD_OBSERVER_SOURCES = {'storage':held['owned_storage_backend'], 'command':held['storage_owner_command']}
          result = unittest.TextTestRunner().run(unittest.defaultTestLoader.loadTestsFromModule(sys.modules['test_hosted_pair_source']))
          if result.testsRun != 46 or not result.wasSuccessful():
              raise SystemExit('Source controls refused')
          owner = sys.modules['qualify_hosted_pair']
          try:
              if sys.argv[1:] == ['raw-git']:
                  owner.raw_git_main()
              elif sys.argv[1:] == ['pair']:
                  owner.main()
              else:
                  raise SystemExit('Qualified mode refused')
          except BaseException as failure:
              try:
                  owner.write_failure_diagnostic(failure)
                  print('Standalone pair refused; unresolved original owners retained', file=sys.stderr)
              except BaseException:
                  pass
              finally:
                  owner.living_failure_fence()
              raise SystemExit(1)
          PY
      - name: Retain only fixed public standalone receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: financial-shared-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/HostedSharedPair/standalone-pair.json
            TestResults/HostedSharedPair/raw-git.json
            TestResults/HostedSharedPair/first-failure.json
          if-no-files-found: error
          retention-days: 7
