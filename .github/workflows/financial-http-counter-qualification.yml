name: Financial HTTP counter codec qualification

# Assigned draft PR128 is bound in both marked locations.
# Every unrelated PR is refused. This workflow never claims the real financial run.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/FinancialHttpCounters/**'
      - '.github/workflows/financial-http-counter-qualification.yml'
permissions:
  contents: read
concurrency:
  group: financial-http-counter-codec-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  codec-qualification:
    # ASSIGNED_PR_NUMBER_GUARD: actual draft PR128.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 128 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/financial-http-counters-20261007'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # ASSIGNED_PR_NUMBER_INPUT: actual draft PR128, matching the guard above.
      EXPECTED_PR_NUMBER: '128'
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      DOTNET_GCHeapHardLimit: '20000000'
    steps:
      - name: Check out exact guarded source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Locked audit build and actual synthetic codec witness
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=5s 710s python3 -B - <<'PY'
          import copy, ctypes, hashlib, json, os, pathlib, re, selectors, shutil, signal, subprocess, sys, tempfile, time

          # NuGet JSON v1 schema checked against primary ListPackageJsonRenderer/GetReportParameters:
          # https://github.com/NuGet/NuGet.Client/blob/fa1508b1123e9d1d86a39cd702f969d3db242884/src/NuGet.Core/NuGet.CommandLine.XPlat/ListPackage/ListPackageJsonRenderer.cs
          # Empty top-level arrays and omitted transitive arrays are the documented clean vulnerable report.
          SOURCE_INVENTORY = [{'path': 'controls/FinancialHttpCounters.Controls.csproj', 'rawSha256': '583554e4e68a442586b100329c72894ad64d9ea26192699cb4679d2e47bfabe0'}, {'path': 'controls/Program.cs', 'rawSha256': 'cae422f5c11a94b74c2c96f13f89756f83ca262e9557029551fe7628f79b4cdd'}, {'path': 'descriptor-provenance.json', 'rawSha256': '475008becd77ae3555fcf6ddad4bc18406bdf563441c74af4d7fdb9511778da3'}, {'path': 'native-controls/AdmissionNativeControls.cs', 'rawSha256': 'dfa0bd6ebdd7ff770b5a4c6463d71835c112761a54510998cf5600e266c4efe6'}, {'path': 'native-controls/FinancialHttpCounters.NativeControls.csproj', 'rawSha256': '583554e4e68a442586b100329c72894ad64d9ea26192699cb4679d2e47bfabe0'}, {'path': 'native-controls/Program.cs', 'rawSha256': '4783e9aa9fa99de56404a47fbfeb02591447f7eef5ed932b00552e9848c03d3c'}, {'path': 'README.md', 'rawSha256': '4d3820d800d257c97a4c87aeef595930e5a8ba9f2768c7a6d3546034871625aa'}, {'path': 'source/CounterState.cs', 'rawSha256': 'f47257546fa7cc1df99f023068a10446f12890d5a404ba227901612a13faa158'}, {'path': 'source/DescriptorBoundFrontFile.cs', 'rawSha256': '79e6c218c9776888e86cf7fc92ed3f16b8e26058b91df86ab5e2166441e9b185'}, {'path': 'source/DescriptorBoundOutput.cs', 'rawSha256': 'b6c1d45b958db1362c784b64154fdd552711639d5fb5f065a273dd4f9fe974ac'}, {'path': 'source/EventCollector.cs', 'rawSha256': 'a4aae9efd9f798ce39319da7dac5170269b8a6afb2d697c3e1214e2d7b1100a7'}, {'path': 'source/FinancialHttpCounters.csproj', 'rawSha256': '5254ec772153643963d71a2b03d76b8dcc230f9a4a69978d5c7bc6367a8423f9'}, {'path': 'source/ProcessAdmission.cs', 'rawSha256': '349a504e0b206037fc721ccc96cc0972602e6c9eacc7d6942954874256e37aec'}, {'path': 'source/Program.cs', 'rawSha256': 'bb227e581745a355c8df6e3bba50c6cd29d0222d72b5ea073a2266de6c4ea461'}, {'path': 'source-provenance.json', 'rawSha256': '5e66670d9469696a85d14bb74b5e89a2080fa19d59f94662aa708f54a49a4a62'}, {'path': 'witness-host/FinancialHttpCounters.WitnessHost.csproj', 'rawSha256': '25e9385fa7053264d6b20be455942ad1548a587fc006e017350d193d6a1a36b4'}, {'path': 'witness-host/Program.cs', 'rawSha256': 'be6dddd2461f1077ff0832859bd8c63bd28ed6ef2d995fc5054556481ddd775e'}, {'path': 'helper-controls/HelperHostedControls.csproj', 'rawSha256': 'b80e57f135ffd22216a0d7439e089e8f1e92f8fe0b48d6a8f9cea71f19d5e057'}, {'path': 'helper-controls/Program.cs', 'rawSha256': '1b353b259d141711a62829ddfee092e52413c30cedd2cdf1fd0373c99350a70b'}, {'path': 'helper-controls/fixture_git.py', 'rawSha256': '628703d47e3c02a74ed4f119164cc1b20d13b0a1f2c6de14422a173d7d074637'}]
          PROJECTS = (
              'source/FinancialHttpCounters.csproj',
              'controls/FinancialHttpCounters.Controls.csproj',
              'native-controls/FinancialHttpCounters.NativeControls.csproj',
              'witness-host/FinancialHttpCounters.WitnessHost.csproj',
              'helper-controls/HelperHostedControls.csproj',
          )
          LOCKS = tuple(str(pathlib.PurePosixPath(p).parent / 'packages.lock.json') for p in PROJECTS)

          class Refused(Exception): pass

          def require(condition):
              if not condition: raise Refused()

          def pairs(items):
              result = {}
              for key, value in items:
                  require(key not in result); result[key] = value
              return result

          def parse(raw, maximum=1024 * 1024):
              require(type(raw) is bytes and 0 < len(raw) <= maximum)
              return json.loads(raw.decode('utf-8'), object_pairs_hook=pairs,
                                parse_constant=lambda _: (_ for _ in ()).throw(Refused()))

          def clean_audit(raw, expected_project):
              value = parse(raw)
              require(type(value) is dict and set(value) in (
                  {'version', 'parameters', 'sources', 'projects'},
                  {'version', 'parameters', 'sources', 'projects', 'problems'}))
              require(type(value['version']) is int and value['version'] == 1)
              require(value['parameters'] == '--vulnerable --include-transitive')
              require(value['sources'] == ['https://api.nuget.org/v3/index.json'])
              require(type(value.get('problems', [])) is list and value.get('problems', []) == [])
              require(type(value['projects']) is list and len(value['projects']) == 1)
              project = value['projects'][0]
              require(type(project) is dict and set(project) == {'path', 'frameworks'} and project['path'] == expected_project)
              require(type(project['frameworks']) is list and len(project['frameworks']) == 1)
              frame = project['frameworks'][0]
              require(type(frame) is dict and set(frame) in (
                  {'framework', 'topLevelPackages'}, {'framework', 'topLevelPackages', 'transitivePackages'}))
              require(frame['framework'] == 'net10.0')
              # --vulnerable reports only vulnerable packages. Any entry refuses acceptance,
              # including an entry with missing/empty/malformed vulnerability details.
              require(type(frame['topLevelPackages']) is list and frame['topLevelPackages'] == [])
              require(type(frame.get('transitivePackages', [])) is list and frame.get('transitivePackages', []) == [])

          def parser_controls():
              positive = {'version': 1, 'parameters': '--vulnerable --include-transitive',
                          'sources': ['https://api.nuget.org/v3/index.json'], 'projects': [
                              {'path': '/owned/project.csproj', 'frameworks': [{'framework': 'net10.0', 'topLevelPackages': []}]}]}
              def encoded(value): return json.dumps(value).encode()
              clean_audit(encoded(positive), '/owned/project.csproj')
              with_empty = copy.deepcopy(positive); with_empty['problems'] = []
              with_empty['projects'][0]['frameworks'][0]['transitivePackages'] = []
              clean_audit(encoded(with_empty), '/owned/project.csproj')
              cases = [b'', b'prefix' + encoded(positive), encoded(positive) + b'{}', encoded(positive).replace(b'"version": 1', b'"version": 1, "version": 1', 1),
                       b'{"version":NaN}', encoded(positive) * 20000]
              def variant(change):
                  value = copy.deepcopy(positive); change(value); cases.append(encoded(value))
              variant(lambda v: v.update(version=True))
              variant(lambda v: v.update(version=2))
              variant(lambda v: v.update(parameters='--vulnerable'))
              variant(lambda v: v.update(sources=[]))
              variant(lambda v: v.update(sources=['https://private.invalid/index.json']))
              variant(lambda v: v.update(problems=[{'level': 'warning', 'text': 'audit unavailable'}]))
              variant(lambda v: v.update(problems={}))
              variant(lambda v: v.update(unknown=[]))
              variant(lambda v: v.update(projects=[]))
              variant(lambda v: v['projects'].append(copy.deepcopy(v['projects'][0])))
              variant(lambda v: v['projects'][0].update(path='/other/project.csproj'))
              variant(lambda v: v['projects'][0].pop('frameworks'))
              variant(lambda v: v['projects'][0].update(frameworks=[]))
              variant(lambda v: v['projects'][0]['frameworks'][0].update(framework='net9.0'))
              variant(lambda v: v['projects'][0]['frameworks'][0].update(topLevelPackages={}))
              variant(lambda v: v['projects'][0]['frameworks'][0].update(topLevelPackages=[{'id': 'vulnerable', 'vulnerabilities': [{'severity': 'Low'}]}]))
              variant(lambda v: v['projects'][0]['frameworks'][0].update(transitivePackages=[{'id': 'missing-details'}]))
              variant(lambda v: v['projects'][0]['frameworks'][0].update(vulnerabilities=[]))
              for raw in cases:
                  refused = False
                  try: clean_audit(raw, '/owned/project.csproj')
                  except (Refused, ValueError, UnicodeError, TypeError, KeyError): refused = True
                  require(refused)
              return {'PositiveCasesObserved': 2, 'NegativeCasesObserved': len(cases)}

          # Typed Linux kernel reads are separate from source files. The spawned leader remains
          # unreaped until teardown: WNOWAIT reserves its PID/session ID against reuse.
          def generation(pid):
              require(type(pid) is int and pid > 0)
              with open('/proc/' + str(pid) + '/stat', 'rb') as stream: raw = stream.read(8193)
              require(0 < len(raw) <= 8192)
              end = raw.rfind(b')'); require(end > 0 and int(raw[:raw.index(b'(')].strip()) == pid)
              fields = raw[end + 2:].split(); require(len(fields) >= 20)
              return (int(fields[19]), int(fields[1]), int(fields[2]), int(fields[3]), fields[0].decode('ascii'))

          def session_members(session, deadline):
              entries = list(pathlib.Path('/proc').iterdir()); require(len(entries) <= 32768)
              result = {}
              for entry in entries:
                  require(time.monotonic() < deadline)
                  if re.fullmatch(r'[1-9][0-9]*', entry.name) is None: continue
                  try: observed = generation(int(entry.name))
                  except FileNotFoundError: continue  # A vanished kernel process is absent, never an invented owned success.
                  if observed[3] == session: result[int(entry.name)] = observed
              return result

          LAST_CLEANUP = None

          def dispose_owned_session(process, held):
              deadline = time.monotonic() + 5
              failures = []; observed = None; members = None; anchor = held
              # Recovery reobserves the exact un-reaped leader independently of reader setup.
              for attempt in range(2):
                  try:
                      current = generation(process.pid)
                      require(process.returncode is None and current[1:4] == (os.getpid(), process.pid, process.pid))
                      if anchor is not None: require(current[:4] == anchor[:4])
                      anchor = current; observed = current
                      break
                  except Exception as error:
                      failures.append(type(error).__name__)
              if observed is not None:
                  try:
                      members = session_members(process.pid, deadline)
                      require(members.get(process.pid, ())[:4] == anchor[:4])
                  except Exception as error: failures.append(type(error).__name__)
                  for attempt in range(2):
                      try:
                          # The unreaped leader reserves its PID; reobserve before EACH retry.
                          current = generation(process.pid)
                          require(process.returncode is None and current[:4] == anchor[:4] and time.monotonic() < deadline)
                          try: os.killpg(process.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              require(current[4] == 'Z' and members is not None and all(x[4] == 'Z' for x in members.values()))
                          break
                      except Exception as error: failures.append(type(error).__name__)
              # Reaping and readback are attempted even when signal/census failed. Never signal after reaping.
              try: process.wait(timeout=max(0.001, deadline - time.monotonic()))
              except Exception as error: failures.append(type(error).__name__)
              remaining = None
              try:
                  while True:
                      remaining = session_members(process.pid, deadline)
                      if not remaining: break
                      for pid, value in remaining.items():
                          if pid != process.pid and value[1] == os.getpid() and value[4] == 'Z':
                              require(generation(pid) == value)
                              reaped, _ = os.waitpid(pid, os.WNOHANG); require(reaped in (0, pid))
                      require(time.monotonic() < deadline); time.sleep(0.02)
              except Exception as error: failures.append(type(error).__name__)
              if observed is None or members is None or remaining != {} or process.returncode is None: failures.append('OwnedCleanupUncertain')
              receipt = None if failures else {'HeldLeaderExitedBeforeCleanup': observed[4] == 'Z',
                  'SessionMembersBeforeCleanup': len(members), 'SessionMembersAfterCleanup': len(remaining)}
              return receipt, failures

          # All allocations after successful childbirth are inside the protected try. Cleanup
          # attempts remain independent, and recovered uncertainty never becomes a clean receipt.
          STAGES = ('admission', 'source-head', 'supervisor-control', 'sdk', 'restore', 'locked-restore', 'audit', 'format', 'build', 'controls', 'source-helper', 'native', 'receipts')
          CURRENT_STAGE, CURRENT_PROJECT = 'admission', None

          def public_stage(stage, project=None):
              global CURRENT_STAGE, CURRENT_PROJECT
              require(stage in STAGES and (project is None or project in PROJECTS))
              CURRENT_STAGE, CURRENT_PROJECT = stage, project
              print(json.dumps({'QualificationStage': stage, 'Project': project}), flush=True)

          def public_diagnostics(raw, root, stage):
              # Runtime child output can include private witness values: project only stages.
              if stage not in ('restore', 'locked-restore', 'audit', 'format', 'build'): return [], []
              require(type(raw) is bytes and len(raw) <= 8 * 1024 * 1024)
              code_pattern = rb'(?:WHITESPACE|(?:NU|CS|MSB|CA|IDE)[0-9]{3,6})'
              codes = sorted(set(x.decode('ascii') for x in re.findall(rb'\b' + code_pattern + rb'\b', raw)))[:64]
              locations = set()
              for item in SOURCE_INVENTORY:
                  relative = item['path']
                  if not relative.endswith(('.cs', '.csproj')): continue
                  # Match an exact allowlisted public source path, not a raw captured path.
                  for candidate in (str(root / relative), relative):
                      pattern = rb'(?:^|[\r\n])' + re.escape(candidate.encode()) + rb'\(([0-9]{1,7}),([0-9]{1,7})\):\s*(?:error|warning)\s+(' + code_pattern + rb')\b'
                      for match in re.finditer(pattern, raw):
                          line, column = int(match[1]), int(match[2])
                          if 0 < line <= 1000000 and 0 < column <= 1000000:
                              locations.add((relative, line, column, match[3].decode('ascii')))
              return codes, [{'Source': path, 'Line': line, 'Column': column, 'Code': code}
                             for path, line, column, code in sorted(locations)[:64]]

          NATIVE_CONTROL_ORDER = ('Context', 'AdmissionBegin', 'AdmissionRootCreate', 'AdmissionFifoCreate', 'AdmissionFifoReject', 'AdmissionDeviceReject', 'AdmissionDirectoryReject', 'AdmissionPrivateFileCreate', 'AdmissionSymlinkReplacement', 'AdmissionSymlinkRecovery', 'AdmissionSameBytesReplacement', 'AdmissionReplacementRecovery', 'AdmissionModeReject', 'AdmissionExpiredReject', 'AdmissionOutputPrepare', 'AdmissionRedirectedOutput', 'AdmissionReplacedOutput', 'AdmissionPositiveOutput', 'AdmissionCleanup', 'CallerPaths', 'FaultBegin', 'WitnessReserve', 'WitnessConfigure', 'WitnessBirth', 'WitnessSetup', 'WitnessInjectedFailure', 'WitnessCleanup', 'FaultResult', 'CodecBegin', 'WitnessReserve', 'WitnessConfigure', 'WitnessBirth', 'WitnessSetup', 'WitnessReaders', 'WitnessReadiness', 'WitnessPin', 'WitnessCollectorStart', 'WitnessCanary', 'WitnessCompletion', 'WitnessReplay', 'WitnessDrain', 'WitnessCounters', 'WitnessCleanup', 'CodecResult', 'Receipt')
          NATIVE_FAILURE_ONLY = ('ReaderParserSetup', 'ReaderProcessIdentity', 'ReaderListenerSchema', 'ReaderBridgeSchema', 'ReaderProjectionArguments', 'ReaderCounterState', 'ReaderParserRead', 'ReaderParserCompletion', 'ReaderStreamCompletion', 'ReaderCancelled', 'ReaderUnknown', 'CanaryMissingHeartbeat', 'CanaryMissingHealth', 'CanaryMissingBoth')
          NATIVE_MARKER_LINES = {json.dumps({'NativeControl': control}, separators=(',', ':')).encode('ascii'): control
                                 for control in frozenset(NATIVE_CONTROL_ORDER + NATIVE_FAILURE_ONLY)}

          def native_control_projection(raw, succeeded=False):
              require(type(raw) is bytes and len(raw) <= 4 * 1024 * 1024 and type(succeeded) is bool)
              markers = []; unknown = malformed = False
              for line in raw.splitlines():
                  if line in NATIVE_MARKER_LINES:
                      markers.append(NATIVE_MARKER_LINES[line]); require(len(markers) <= 128)
                  elif line.strip():
                      unknown = True
                      if line.startswith(b'{"NativeControl"'): malformed = True
              observed = tuple(markers)
              valid_orders = {NATIVE_CONTROL_ORDER[:index] for index in range(len(NATIVE_CONTROL_ORDER) + 1)}
              # Failure unwinds through the existing admission/fault/codec finally blocks.
              # A cleanup marker means entered cleanup, never verified cleanup or acceptance.
              for index in range(1, len(NATIVE_CONTROL_ORDER)):
                  prefix = NATIVE_CONTROL_ORDER[:index]
                  if index <= NATIVE_CONTROL_ORDER.index('AdmissionCleanup'):
                      if prefix[-1] != 'AdmissionCleanup': valid_orders.add(prefix + ('AdmissionCleanup',))
                  elif NATIVE_CONTROL_ORDER.index('FaultBegin') < index <= NATIVE_CONTROL_ORDER.index('FaultResult'):
                      if prefix[-1] != 'WitnessCleanup': valid_orders.add(prefix + ('WitnessCleanup',))
                  elif NATIVE_CONTROL_ORDER.index('CodecBegin') < index <= NATIVE_CONTROL_ORDER.index('CodecResult'):
                      if prefix[-1] != 'WitnessCleanup': valid_orders.add(prefix + ('WitnessCleanup',))
              # One frozen category can explain only the codec canary failure. It never extends success.
              canary_end = NATIVE_CONTROL_ORDER.index('WitnessCanary') + 1
              canary_prefix = NATIVE_CONTROL_ORDER[:canary_end]
              for category in NATIVE_FAILURE_ONLY:
                  valid_orders.add(canary_prefix + (category,))
                  valid_orders.add(canary_prefix + (category, 'WitnessCleanup'))
              accepted = bool(markers) and not malformed and observed in valid_orders
              if succeeded:
                  canonical = b''.join(json.dumps({'NativeControl': control}, separators=(',', ':')).encode('ascii') + b'\n'
                                       for control in NATIVE_CONTROL_ORDER)
                  require(accepted and observed == NATIVE_CONTROL_ORDER and not unknown and raw == canonical)
              return {'NativeMarkerProtocolAccepted': accepted, 'NativeMarkerCount': len(markers),
                      'NativeControlsObserved': markers[-8:] if accepted else [],
                      'NativeLastControl': markers[-1] if accepted and markers else None,
                      'NativeLastOperation': next((x for x in reversed(markers) if x not in ('AdmissionCleanup', 'WitnessCleanup')), None) if accepted else None}

          def native_failure_marker_controls():
              positive = negative = privacy = 0

              def encoded(markers):
                  return b''.join(json.dumps({'NativeControl': marker}, separators=(',', ':')).encode('ascii') + b'\n'
                                  for marker in markers)

              def refused_success(raw):
                  nonlocal negative
                  rejected = False
                  try: native_control_projection(raw, succeeded=True)
                  except Refused: rejected = True
                  require(rejected); negative += 1

              canonical = encoded(NATIVE_CONTROL_ORDER)
              require(len(NATIVE_CONTROL_ORDER) == 45 and native_control_projection(canonical, succeeded=True)['NativeMarkerProtocolAccepted'])
              positive += 1
              canary = NATIVE_CONTROL_ORDER.index('WitnessCanary')
              prefix = NATIVE_CONTROL_ORDER[:canary + 1]
              require(NATIVE_CONTROL_ORDER.index('CodecBegin') < canary and NATIVE_CONTROL_ORDER[canary + 1] == 'WitnessCompletion')
              require(len(NATIVE_FAILURE_ONLY) == 14 and len(set(NATIVE_FAILURE_ONLY)) == 14
                      and not set(NATIVE_FAILURE_ONLY).intersection(NATIVE_CONTROL_ORDER))
              for marker in NATIVE_FAILURE_ONLY:
                  for tail in ((), ('WitnessCleanup',)):
                      raw = encoded(prefix + (marker,) + tail)
                      result = native_control_projection(raw)
                      require(result['NativeMarkerProtocolAccepted'] and result['NativeLastOperation'] == marker
                              and result['NativeMarkerCount'] == len(prefix) + 1 + len(tail))
                      positive += 1
                      refused_success(raw)
                  # Failure categories can occur only immediately after the CODEC canary.
                  for position in range(len(NATIVE_CONTROL_ORDER) + 1):
                      if position == canary + 1: continue
                      result = native_control_projection(encoded(NATIVE_CONTROL_ORDER[:position] + (marker,)))
                      require(not result['NativeMarkerProtocolAccepted'] and result['NativeControlsObserved'] == [])
                      negative += 1
                  for invalid in (prefix + (marker, marker), prefix + (marker, 'WitnessCleanup', marker),
                                  prefix + (marker, 'WitnessCompletion'), prefix + ('WitnessCleanup', marker),
                                  prefix + (marker, 'WitnessCleanup', 'WitnessCleanup')):
                      result = native_control_projection(encoded(invalid))
                      require(not result['NativeMarkerProtocolAccepted']); negative += 1
                  # Unknown private trace bytes remain discarded; they never enter typed public results.
                  raw = encoded(prefix + (marker, 'WitnessCleanup')) + b'private-opaque-value /private/path token-value\n'
                  result = native_control_projection(raw)
                  require(result['NativeMarkerProtocolAccepted'] and result['NativeLastOperation'] == marker
                          and 'private' not in json.dumps(result) and 'token-value' not in json.dumps(result))
                  privacy += 1
                  for counterfeit in (b'{"NativeControl":"' + marker.encode() + b'","Private":"opaque"}\n',
                                      b'{"NativeControl":"' + marker.encode() + b'PrivateSuffix"}\n'):
                      result = native_control_projection(encoded(prefix) + counterfeit + encoded(('WitnessCleanup',)))
                      require(not result['NativeMarkerProtocolAccepted'] and 'opaque' not in json.dumps(result))
                      negative += 1; privacy += 1
                  for changed_line in (b' ' + encoded((marker,)), encoded((marker,)).replace(b'{"', b'{ "')):
                      result = native_control_projection(encoded(prefix) + changed_line + encoded(('WitnessCleanup',)))
                      require(result['NativeLastOperation'] not in NATIVE_FAILURE_ONLY)
                      negative += 1
                  refused_success(canonical + encoded((marker,)))
                  refused_success(encoded(NATIVE_CONTROL_ORDER[:canary + 1] + (marker,) + NATIVE_CONTROL_ORDER[canary + 1:]))
              for bad_success in (canonical.replace(b'\n', b'\r\n'), canonical + b'\n', canonical[:-1],
                                  b' ' + canonical, canonical.replace(b':', b': ', 1),
                                  canonical + b'private-opaque-value\n'):
                  refused_success(bad_success)
              return {'NativeFailureMarkerParserPositiveCases': positive,
                      'NativeFailureMarkerParserNegativeCases': negative,
                      'NativeFailureMarkerPrivacyCases': privacy,
                      'UnchangedSuccessMarkerCount': 45, 'FailureOnlyCategoryCount': 14,
                      'LocalNativeExecution': False, 'GenuineEightHostFinancialAccepted': False}

          def run(argv, cwd, seconds, stderr_must_be_empty=True, stage="supervisor-control", project=None):
              global LAST_CLEANUP
              LAST_CLEANUP = None
              public_stage(stage, project)
              end = min(time.monotonic() + seconds, OVERALL_DEADLINE); require(end > time.monotonic())
              held = selector = primary = observation = None
              process = subprocess.Popen(argv, cwd=cwd, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                         stderr=subprocess.PIPE, start_new_session=True)
              try:
                  output, error = bytearray(), bytearray()
                  selector = selectors.DefaultSelector()
                  held = generation(process.pid)
                  require(held[1:4] == (os.getpid(), process.pid, process.pid))
                  selector.register(process.stdout, selectors.EVENT_READ, output)
                  selector.register(process.stderr, selectors.EVENT_READ, error)
                  while selector.get_map():
                      require(time.monotonic() < end)
