                      and LAST_CLEANUP['SessionMembersBeforeCleanup'] >= 2 and LAST_CLEANUP['SessionMembersAfterCleanup'] == 0)
              # Constructor failure occurs AFTER a real child is born, before reader creation.
              original = selectors.DefaultSelector
              def fail_after_birth(): raise InjectedSelectorSetupFailure()
              selectors.DefaultSelector = fail_after_birth
              injected = False
              try:
                  try: run([sys.executable, '-c', 'import time; time.sleep(30)'], root, 3)
                  except InjectedSelectorSetupFailure: injected = True
              finally: selectors.DefaultSelector = original
