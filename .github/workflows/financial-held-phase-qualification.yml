name: Held financial phase transport qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/FinancialHttpCounters/**'
      - 'tools/InvoiceCompletionProducerAcceptance/companion/**'
      - 'tools/FinancialOwnerReceiptCoordinator/**'
      - 'tools/FinancialCompositionAdapter.Qualification/owned_command.py'
      - 'docs/financial-held-phase-qualification.md'
      - '.github/workflows/financial-held-phase-qualification.yml'
      - '.github/workflows/financial-http-counter-qualification.yml'
permissions:
  contents: read
concurrency:
  group: financial-held-phase-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  held-phase-qualification:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 128 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'codex/financial-http-counters-20261007'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact guarded source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Hold and verify source bytes before any companion execution
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          umask 077
          python3 -B - <<'PY'
          def qualification_stage():
              import hashlib, os, pathlib, stat
              expected = {'tools/FinancialCompositionAdapter.Qualification/owned_command.py': (16674, '427f68ef6a78c9b6428bda39b93be782188ed398fd748ad69dc562f02868f993'), 'tools/InvoiceCompletionProducerAcceptance/companion/held_parent_io.py': (13032, 'b1f65e46aabafa312500e987e4dc1fbe06034e663cf2d04001638a09b3fe84e7'), 'tools/InvoiceCompletionProducerAcceptance/companion/held_linux_exit.py': (4218, 'e7c809d0a1a9c8e8673ed5ef299dd530774d68a48196a739a90f0eaaf5e11515'), 'tools/FinancialOwnerReceiptCoordinator/coordinator.py': (17730, '6dd6302bd82fc249767ad24b32e5555afabf4ae2aec48a465d385e85d613fed4'), 'tools/InvoiceCompletionProducerAcceptance/companion/collector_preack.py': (11989, 'dca7fac535bef9f614d763572d4d87ec51d15ab6f4fff1ed71ccc1ae9334c2fe'), 'tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/fixture.py': (2196, 'c620d7d26884d9a89f954ecbbe695f0ffdeef27fdbff10b9876db59825f55f18'), 'tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/hosted_controls.py': (25138, '4e63a0116160c250b7dabdd784633cee4fc39c99bedf750bad7e5d53d9c8a603'), 'tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/manifest.json': (1322, '75095b92e10d4fcc5b177bbb9d6db4e36297664e3b17fb50d3ad54f92105d499'), 'tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/test_source_controls.py': (7433, '6c014c9713f89a479554745af16a0dd1b4ecbed1a64435d6a525294a294500d0')}
              source = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
              private = pathlib.Path(os.environ['RUNNER_TEMP']) / 'held-phase-inputs'
              private.mkdir(mode=0o700, exist_ok=False)
              for relative, (count, digest) in expected.items():
                  path = source / relative
                  if not path.resolve().is_relative_to(source):
                      raise SystemExit('Held source refused')
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
                  try:
                      before = os.fstat(fd)
                      if not stat.S_ISREG(before.st_mode) or before.st_size != count:
                          raise SystemExit('Held source refused')
                      with os.fdopen(fd, 'rb', closefd=False) as stream:
                          raw = stream.read(count + 1)
                      after = os.fstat(fd)
                      identity = lambda value: (value.st_dev, value.st_ino, value.st_size, value.st_mtime_ns, value.st_mode)
                      if len(raw) != count or hashlib.sha256(raw).hexdigest() != digest or identity(before) != identity(after):
                          raise SystemExit('Held source refused')
                  finally:
                      os.close(fd)
                  target = private / relative
                  target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  with target.open('xb') as stream:
                      stream.write(raw)
                  target.chmod(0o400)
              print('{"HeldPhaseSourcePreflightPassed":true}')
          try:
              qualification_stage()
          except BaseException:
              print('{"HeldPhaseQualificationRefused":true}')
              raise SystemExit(1) from None
          PY
      - name: Require pure mocked admission controls distinct from Linux cases
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          umask 077
          python3 -B "$RUNNER_TEMP/held-phase-inputs/tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/test_source_controls.py" > "$RUNNER_TEMP/held-phase-pure.json"
          python3 -B - <<'PY'
          def qualification_stage():
              import json, os, pathlib
              expected = {'PureMockedControlsPassed': 55, 'ActualHostedCasesExecuted': 0, 'ActualChildrenStarted': False, 'ActualDescriptorsObserved': False, 'CollectorPreackAccepted': False, 'FinancialEightAccepted': False}
              with (pathlib.Path(os.environ['RUNNER_TEMP']) / 'held-phase-pure.json').open('rb') as stream:
                  raw = stream.read(4097)
              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result: raise ValueError('Duplicate control field')
                      result[key] = value
                  return result
              if len(raw) > 4096: raise SystemExit('Pure control receipt refused')
              actual = json.loads(raw, object_pairs_hook=pairs)
              if type(actual) is not dict or set(actual) != set(expected) or any(type(actual[key]) is not type(value) or actual[key] != value for key, value in expected.items()):
                  raise SystemExit('Pure control receipt refused')
          try:
              qualification_stage()
          except BaseException:
              print('{"HeldPhaseQualificationRefused":true}')
              raise SystemExit(1) from None
          PY
      - name: Require six actual held phase kernel and pipe cases
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=5s 240s python3 -B "$RUNNER_TEMP/held-phase-inputs/tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/hosted_controls.py" "$RUNNER_TEMP/held-phase-inputs" "$RUNNER_TEMP/held-phase-controls-public.json"
          python3 -B - <<'PY'
          def qualification_stage():
              import hashlib, json, os, pathlib, re, sys, types
              expected = {'tools/FinancialCompositionAdapter.Qualification/owned_command.py': (16674, '427f68ef6a78c9b6428bda39b93be782188ed398fd748ad69dc562f02868f993'), 'tools/InvoiceCompletionProducerAcceptance/companion/held_parent_io.py': (13032, 'b1f65e46aabafa312500e987e4dc1fbe06034e663cf2d04001638a09b3fe84e7'), 'tools/InvoiceCompletionProducerAcceptance/companion/held_linux_exit.py': (4218, 'e7c809d0a1a9c8e8673ed5ef299dd530774d68a48196a739a90f0eaaf5e11515'), 'tools/FinancialOwnerReceiptCoordinator/coordinator.py': (17730, '6dd6302bd82fc249767ad24b32e5555afabf4ae2aec48a465d385e85d613fed4'), 'tools/InvoiceCompletionProducerAcceptance/companion/collector_preack.py': (11989, 'dca7fac535bef9f614d763572d4d87ec51d15ab6f4fff1ed71ccc1ae9334c2fe'), 'tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/fixture.py': (2196, 'c620d7d26884d9a89f954ecbbe695f0ffdeef27fdbff10b9876db59825f55f18'), 'tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/hosted_controls.py': (25138, '4e63a0116160c250b7dabdd784633cee4fc39c99bedf750bad7e5d53d9c8a603'), 'tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/manifest.json': (1322, '75095b92e10d4fcc5b177bbb9d6db4e36297664e3b17fb50d3ad54f92105d499'), 'tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/test_source_controls.py': (7433, '6c014c9713f89a479554745af16a0dd1b4ecbed1a64435d6a525294a294500d0')}
              private = pathlib.Path(os.environ['RUNNER_TEMP']) / 'held-phase-inputs'
              verified = {}
              for relative, (count, digest) in expected.items():
                  with (private / relative).open('rb') as stream:
                      raw = stream.read(count + 1)
                  if len(raw) != count or hashlib.sha256(raw).hexdigest() != digest:
                      raise SystemExit('Held source readback refused')
                  verified[relative] = raw
              directory = 'tools/InvoiceCompletionProducerAcceptance/companion/phase-held-controls/'
              module = types.ModuleType('held_phase_public_validator')
              module.__file__ = str(private / (directory + 'hosted_controls.py'))
              sys.modules[module.__name__] = module
              exec(compile(verified[directory + 'hosted_controls.py'], module.__file__, 'exec'), module.__dict__)
              output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'held-phase-controls-public.json'
              with output.open('rb') as stream:
                  raw = stream.read(32769)
              if not 0 < len(raw) <= 32768: raise SystemExit('Public phase receipt refused')
              actual = json.loads(raw, object_pairs_hook=module.unique_pairs)
              if type(actual) is not dict or set(actual) != {'Schema', 'Completed', 'Metadata', 'Cases'} or type(actual['Schema']) is not int or actual['Schema'] != 1 or actual['Completed'] is not True:
                  raise SystemExit('Public phase receipt refused')
              manifest_raw = verified[directory + 'manifest.json']
              manifest = json.loads(manifest_raw, object_pairs_hook=module.unique_pairs)
              expected_metadata = {'ManifestSha256': hashlib.sha256(manifest_raw).hexdigest(), 'SourceSha256': {item['module']: item['sha256'] for item in manifest['Dependencies']}, 'FixtureSha256': manifest['Fixture']['sha256'], 'ObservedPythonVersion': list(sys.version_info[:3])}
              if type(actual['Metadata']) is not dict or actual['Metadata'] != expected_metadata or any(type(value) is not int for value in actual['Metadata'].get('ObservedPythonVersion', [])):
                  raise SystemExit('Public phase metadata refused')
              if type(actual['Cases']) is not list or len(actual['Cases']) != 6 or tuple(case.get('Case') for case in actual['Cases'] if type(case) is dict) != module.CASES:
                  raise SystemExit('Public phase cases refused')
              for case in actual['Cases']: module.validate_public_case(case)
              with (pathlib.Path(os.environ['RUNNER_TEMP']) / 'held-phase-pure.json').open('rb') as stream:
                  pure_raw = stream.read(4097)
              if len(pure_raw) > 4096: raise SystemExit('Pure control receipt refused')
              pure = json.loads(pure_raw, object_pairs_hook=module.unique_pairs)
              expected_pure = {'PureMockedControlsPassed': 55, 'ActualHostedCasesExecuted': 0, 'ActualChildrenStarted': False, 'ActualDescriptorsObserved': False, 'CollectorPreackAccepted': False, 'FinancialEightAccepted': False}
              if type(pure) is not dict or set(pure) != set(expected_pure) or any(type(pure[key]) is not type(value) or pure[key] != value for key, value in expected_pure.items()):
                  raise SystemExit('Pure control receipt refused')
              head, run, attempt = (os.environ[key] for key in ('EXPECTED_SOURCE_HEAD', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT'))
              if re.fullmatch('[a-f0-9]{40}', head) is None or re.fullmatch('[1-9][0-9]{0,19}', run) is None or re.fullmatch('[1-9][0-9]{0,9}', attempt) is None:
                  raise SystemExit('Public phase source association refused')
              envelope = {'SourceHead': head, 'RunId': run, 'RunAttempt': attempt, 'PureMockedControls': pure, 'HeldPhaseControls': actual, 'CanonicalCallerReceiptsAccepted': False, 'CurrentBusinessGraphAccepted': False, 'BusinessPermissionsAccepted': False, 'FullCleanupAccepted': False, 'FinancialEightAccepted': False}
              output.write_text(json.dumps(envelope, sort_keys=True) + '\n', encoding='ascii')
          try:
              qualification_stage()
          except BaseException:
              print('{"HeldPhaseQualificationRefused":true}')
              raise SystemExit(1) from None
          PY
      - name: Retain only named sanitized held phase public receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: financial-held-phase-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/held-phase-controls-public.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
