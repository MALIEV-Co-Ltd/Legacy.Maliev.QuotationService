name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualification-authority-joined:
    name: qualification-authority-joined
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out QuotationService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact Auth producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.AuthService
          ref: 8cdb634b3b0abdf18b9b826a0948dbfd98c66ea0
          path: TestResults/.joined-auth/Legacy.Maliev.AuthService
          persist-credentials: false
      - name: Check out isolated Auth Defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 5c5f9479313710fa576f83d3b396442997a2fcf4
          path: TestResults/.joined-auth/.dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out isolated Auth Contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: TestResults/.joined-auth/.dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out isolated Quotation Defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: f72be151917cb3962380971418c187e3df563f8d
          path: TestResults/.bridge-dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out isolated Quotation Contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: TestResults/.bridge-dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Prove real joined qualification authority
        shell: pwsh
        run: ./scripts/run_qualification_authority_joined.ps1 -RepositoryPath $env:GITHUB_WORKSPACE

  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
    steps:
      - name: Check out QuotationService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: f72be151917cb3962380971418c187e3df563f8d
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out exact Accounting consumer test dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.AccountingService
          ref: ae0826156b06c34476e95de8c53dfccfcf5a5972
          path: .dependencies/Legacy.Maliev.AccountingService
          persist-credentials: false
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@53892c362a30130f582c40da7525e44f11474e8e
        with:
          solution: Legacy.Maliev.QuotationService.slnx
          use-local-maliev-dependencies: 'true'

      - name: Prove coverage gate failure and success behavior
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -B -m unittest discover -s tools/InvoiceCompletionProducerAcceptance/companion -p 'test_*.py'

      - name: Prove actual qualification DTO and controller serializer wire
        timeout-minutes: 2
        shell: bash
        run: |
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~QualificationOutcomeWireSourceTests' \
            --results-directory TestResults/QualificationWire --logger 'trx;LogFileName=qualification-wire.trx'
          python3 -B scripts/check_qualification_wire_results.py
          dotnet tools/QualificationOutcomeWireSource/bin/Release/net10.0/QualificationOutcomeWireSource.dll "$GITHUB_WORKSPACE"

      - name: Collect QuotationService coverage
        shell: bash
        run: |
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~QuotationInvoiceCapabilityVerifierTests' \
            --results-directory TestResults/C821Verifier --logger 'trx;LogFileName=c821-verifier.trx'
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~QuotationInvoiceCapabilityHttpTests' \
            --results-directory TestResults/C821Recipient --logger 'trx;LogFileName=c821-recipient.trx'
          python3 scripts/check_c821_focused_results.py
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~CompanionLauncherAdmissionTests' \
            --results-directory TestResults/CompanionAdmission --logger 'trx;LogFileName=companion-admission.trx'
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~HostedV4SignedReadVerifierTests' \
            --results-directory TestResults/CompanionSigning --logger 'trx;LogFileName=companion-signing.trx'
          python3 -B scripts/check_companion_focused_results.py
          dotnet test tools/HostedStorageFront.Tests/HostedStorageFront.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --results-directory TestResults/StorageFront --logger 'trx;LogFileName=storage-front.trx'
          python3 -B scripts/check_storage_front_results.py
          dotnet test tools/FinancialCompletionEvidence.Tests/FinancialCompletionEvidence.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --results-directory TestResults/FinancialCompletion --logger 'trx;LogFileName=financial-completion.trx'
          python3 -B scripts/check_financial_completion_results.py
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:GITHUB_ACTIONS=false --collect 'XPlat Code Coverage' --results-directory TestResults/CoverageGate \
            --settings Legacy.Maliev.QuotationService.Tests/coverage.runsettings \
            --logger 'trx;LogFileName=quotation-complete-coverage.trx'

      - name: Enforce 80 percent owned handwritten line coverage
        shell: bash
        run: |
          mapfile -t reports < <(find TestResults/CoverageGate -mindepth 2 -maxdepth 2 -type f -name coverage.cobertura.xml)
          if [[ "${#reports[@]}" -ne 1 ]]; then
            echo "Expected exactly one Cobertura report, found ${#reports[@]}." >&2
            exit 1
          fi
          python3 scripts/check_owned_coverage.py "${reports[0]}" --minimum 80
          python3 scripts/check_owned_coverage.py "${reports[0]}" --minimum 80 --raw

      - name: Retain complete coverage evidence
        if: always() && (hashFiles('TestResults/CoverageGate/quotation-complete-coverage.trx') != '' || hashFiles('TestResults/C821Verifier/c821-verifier.trx', 'TestResults/C821Recipient/c821-recipient.trx') != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quotation-complete-coverage-${{ github.sha }}
          path: |
            TestResults/C821Verifier/c821-verifier.trx
            TestResults/C821Recipient/c821-recipient.trx
            TestResults/CompanionAdmission/companion-admission.trx
            TestResults/CompanionSigning/companion-signing.trx
            TestResults/StorageFront/storage-front.trx
            TestResults/FinancialCompletion/financial-completion.trx
            TestResults/CoverageGate/quotation-complete-coverage.trx
            TestResults/CoverageGate/*/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false

      - name: Retain actual qualification wire-source evidence
        if: always() && hashFiles('TestResults/QualificationWire/qualification-wire.trx') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-source-wire-${{ github.sha }}
          path: |
            TestResults/QualificationWire/qualification-wire.trx
            TestResults/QualificationWire/qualification-wire-receipt.json
            TestResults/QualificationWire/empty.json
            TestResults/QualificationWire/mixed.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false
