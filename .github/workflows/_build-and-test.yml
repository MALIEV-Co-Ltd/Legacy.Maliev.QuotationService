name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualification-authority-joined:
    name: qualification-authority-joined
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: ghcr.io/testcontainers/ryuk@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
    steps:
      - name: Check out QuotationService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact Auth producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.AuthService
          ref: 8cdb634b3b0abdf18b9b826a0948dbfd98c66ea0
          path: TestResults/.joined-auth/Legacy.Maliev.AuthService
          persist-credentials: false
      - name: Check out isolated Auth Defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 5c5f9479313710fa576f83d3b396442997a2fcf4
          path: TestResults/.joined-auth/.dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out isolated Auth Contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: TestResults/.joined-auth/.dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out isolated Quotation Defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: f72be151917cb3962380971418c187e3df563f8d
          path: TestResults/.bridge-dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out isolated Quotation Contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: TestResults/.bridge-dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Compile and test registry prerequisite controls
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B -c "from pathlib import Path; [compile(p.read_bytes(),str(p),'exec') for p in (Path('scripts/registry_preload/preload_images.py'),Path('scripts/tests/test_registry_preload.py'))]"
          python3 -B -m unittest discover -s scripts/tests -p test_registry_preload.py
          python3 -B -O -m unittest discover -s scripts/tests -p test_registry_preload.py
      - name: Prepare exact official fixture images
        timeout-minutes: 5
        shell: bash
        run: python3 -B scripts/registry_preload/preload_images.py
      - name: Prove real joined qualification authority
        shell: pwsh
        run: ./scripts/run_qualification_authority_joined.ps1 -RepositoryPath $env:GITHUB_WORKSPACE

      - name: Release exact owned image references
        if: always()
        timeout-minutes: 2
        shell: bash
        run: python3 -B scripts/registry_preload/preload_images.py cleanup
      - name: Retain registry custody evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quotation-registry-custody-${{ github.job }}-${{ github.sha }}
          path: ${{ runner.temp }}/quotation-registry-preload.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: false

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      TESTCONTAINERS_RYUK_CONTAINER_IMAGE: ghcr.io/testcontainers/ryuk@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
    steps:
      - name: Check out QuotationService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: f72be151917cb3962380971418c187e3df563f8d
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out exact Accounting consumer test dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.AccountingService
          ref: ae0826156b06c34476e95de8c53dfccfcf5a5972
          path: .dependencies/Legacy.Maliev.AccountingService
          persist-credentials: false
      - name: Compile and test registry prerequisite controls
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B -c "from pathlib import Path; [compile(p.read_bytes(),str(p),'exec') for p in (Path('scripts/registry_preload/preload_images.py'),Path('scripts/tests/test_registry_preload.py'))]"
          python3 -B -m unittest discover -s scripts/tests -p test_registry_preload.py
          python3 -B -O -m unittest discover -s scripts/tests -p test_registry_preload.py
      - name: Prepare exact official fixture images
        timeout-minutes: 5
        shell: bash
        run: python3 -B scripts/registry_preload/preload_images.py
      - name: Set up SDK for inspection focus
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Verify inspection result controls
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_docker_context_inspection_results.py'
          python3 -B -O -m unittest discover -s scripts/tests -p 'test_docker_context_inspection_results.py'
      - name: Build and prove Docker context inspection before full suite
        timeout-minutes: 5
        shell: bash
        run: |
          dotnet restore Legacy.Maliev.QuotationService.slnx -p:GITHUB_ACTIONS=false
          dotnet build Legacy.Maliev.QuotationService.slnx --configuration Release --no-restore -warnaserror -p:GITHUB_ACTIONS=false
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~Legacy.Maliev.QuotationService.Tests.Infrastructure.DockerContextInspectionContractTests' \
            --results-directory TestResults/DockerContextInspection \
            --logger 'trx;LogFileName=docker-context-inspection.trx'
          python3 -B scripts/check_docker_context_inspection_results.py
      - name: Retain Docker context inspection evidence
        if: always() && hashFiles('TestResults/DockerContextInspection/docker-context-inspection.trx') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quotation-docker-context-inspection-${{ github.sha }}
          path: |
            TestResults/DockerContextInspection/docker-context-inspection.trx
            scripts/docker_context_inspection_focus.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@53892c362a30130f582c40da7525e44f11474e8e
        with:
          solution: Legacy.Maliev.QuotationService.slnx
          use-local-maliev-dependencies: 'true'

      - name: Verify ordinary controller parity result controls
        shell: bash
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_quotation_controller_parity_results.py'
          python3 -B -m unittest discover -s scripts/tests -p 'test_quotation_pagination_parity_results.py'
          python3 -B -m unittest discover -s scripts/tests -p 'test_quotation_omitted_size_results.py'
          python3 -B -m unittest discover -s scripts/tests -p 'test_quotation_explicit_size_results.py'

      - name: Prove ordinary controller parity independently
        timeout-minutes: 5
        shell: bash
        run: |
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~QuotationOrderItemMutationVersionHttpTests|FullyQualifiedName~Ordinary_update_advances_microsecond_version_and_rejects_replayed_token_when_clock_stalls_or_regresses|FullyQualifiedName~QuotationOrderItemCollectionContractTests|FullyQualifiedName~QuotationOrderItemCollectionHttpTests' \
            --results-directory TestResults/ControllerParity --logger 'trx;LogFileName=controller-parity.trx'
          python3 -B scripts/check_quotation_controller_parity_results.py TestResults/ControllerParity/controller-parity.trx
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~Empty_database_keeps_source_notfound_for_default_filtered_and_distant_pages|FullyQualifiedName~Distant_page_preserves_customer_filter_and_source_notfound_without_wrapping|FullyQualifiedName~Distant_page_does_not_overflow_or_replay_first_page_rows|FullyQualifiedName~Numeric_search_and_page_bounds_preserve_current_consumer_contract' \
            --results-directory TestResults/PaginationParity --logger 'trx;LogFileName=pagination-parity.trx'
          python3 -B scripts/check_quotation_pagination_parity_results.py TestResults/PaginationParity/pagination-parity.trx
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~Omitted_size_uses_filtered_count_without_default_or_cap' \
            --results-directory TestResults/OmittedSize --logger 'trx;LogFileName=omitted-size.trx'
          python3 -B scripts/check_quotation_omitted_size_results.py TestResults/OmittedSize/omitted-size.trx
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~Positive_explicit_size_is_not_capped_after_filtering' \
            --results-directory TestResults/ExplicitSize --logger 'trx;LogFileName=explicit-size.trx'
          python3 -B scripts/check_quotation_explicit_size_results.py TestResults/ExplicitSize/explicit-size.trx

      - name: Retain ordinary controller parity evidence
        if: always() && hashFiles('TestResults/ControllerParity/controller-parity.trx') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quotation-controller-parity-${{ github.sha }}
          path: |
            TestResults/ControllerParity/controller-parity.trx
            scripts/quotation_controller_parity_focus.json
            TestResults/PaginationParity/pagination-parity.trx
            scripts/quotation_pagination_parity_focus.json
            TestResults/OmittedSize/omitted-size.trx
            scripts/quotation_omitted_size_focus.json
            TestResults/ExplicitSize/explicit-size.trx
            scripts/quotation_explicit_size_focus.json
          if-no-files-found: error
          retention-days: 7

      - name: Prove coverage gate failure and success behavior
        shell: bash
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -B -m unittest discover -s tools/InvoiceCompletionProducerAcceptance/companion -p 'test_*.py'

      - name: Prove actual qualification DTO and controller serializer wire
        timeout-minutes: 2
        shell: bash
        run: |
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~QualificationOutcomeWireSourceTests' \
            --results-directory TestResults/QualificationWire --logger 'trx;LogFileName=qualification-wire.trx'
          python3 -B scripts/check_qualification_wire_results.py
          dotnet tools/QualificationOutcomeWireSource/bin/Release/net10.0/QualificationOutcomeWireSource.dll "$GITHUB_WORKSPACE"

      - name: Collect QuotationService coverage
        shell: bash
        run: |
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~QuotationAnalyticsSourceContractTests|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Data.QuotationPostgresMigrationTests.AnalyticsSourceIndexMigration_GeneratesScriptsAndPreservesRowsAcrossUpgradeRollbackAndReupgrade' \
            --results-directory TestResults/C6SourceIndex --logger 'trx;LogFileName=c6-source-index.trx'
          python3 -B scripts/check_c6_source_index_results.py
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~ContainerOperationCustodyContractTests|FullyQualifiedName~DockerBindCollisionContractTests.FailedCleanupOfHostBindAttemptNeverAdmitsBackoffOrReplacement|FullyQualifiedName~QualificationBridgeConsumerHttpTests.Last_representable_qualification_revision_is_committed_and_replayed_but_exhausted_transition_cannot_wrap|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Workflows.WorkflowContractTests.BuildAndTest_RejectsQualificationCustodyFocusBypass|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Workflows.WorkflowContractTests.BuildAndTest_RejectsC6SourceIndexFocusBypass|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Workflows.WorkflowContractTests.BuildAndTest_RejectsCoverageEvidenceContractMutation|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Controllers.QuotationRequestTriageHttpTests.Padded_text_search_preserves_each_source_field_literal|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Controllers.QuotationRequestTriageHttpTests.Padded_text_search_preserves_tabs_and_Thai|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Controllers.QuotationRequestTriageHttpTests.Padded_text_without_literal_match_retains_source_notfound|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Controllers.QuotationRequestTriageHttpTests.Padded_numeric_search_keeps_source_identifier_selection|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Controllers.QuotationRequestTriageHttpTests.Blank_http_query_retains_actual_model_binding_contract|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Controllers.QuotationRequestTriageHttpTests.Direct_repository_whitespace_keeps_source_literal_filter|FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Controllers.QuotationRequestTriageHttpTests.Padded_search_retains_auth_and_live_permission_guards' \
            --results-directory TestResults/QualificationCustody --logger 'trx;LogFileName=qualification-custody.trx'
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName=Legacy.Maliev.QuotationService.Tests.Analytics.QuotationTerminalLoggingPipelineTests.Program_ReclaimedLease_OnlyCurrentOwnerEmitsDurableTerminalFailure' \
            --results-directory TestResults/AnalyticsLeaseReclaim --logger 'trx;LogFileName=analytics-lease-reclaim.trx'
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~Legacy.Maliev.QuotationService.Tests.Analytics.QuotationTerminalLoggingPipelineTests.DeliverySettlement_' \
            --results-directory TestResults/AnalyticsDeliverySettlement --logger 'trx;LogFileName=analytics-delivery-settlement.trx'
          python3 -B scripts/check_analytics_ack_focused_results.py
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~QuotationInvoiceCapabilityVerifierTests' \
            --results-directory TestResults/C821Verifier --logger 'trx;LogFileName=c821-verifier.trx'
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~QuotationInvoiceCapabilityHttpTests' \
            --results-directory TestResults/C821Recipient --logger 'trx;LogFileName=c821-recipient.trx'
          python3 scripts/check_c821_focused_results.py
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~CompanionLauncherAdmissionTests' \
            --results-directory TestResults/CompanionAdmission --logger 'trx;LogFileName=companion-admission.trx'
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --filter 'FullyQualifiedName~HostedV4SignedReadVerifierTests' \
            --results-directory TestResults/CompanionSigning --logger 'trx;LogFileName=companion-signing.trx'
          python3 -B scripts/check_companion_focused_results.py
          dotnet test tools/HostedStorageFront.Tests/HostedStorageFront.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --results-directory TestResults/StorageFront --logger 'trx;LogFileName=storage-front.trx'
          python3 -B scripts/check_storage_front_results.py
          dotnet test tools/FinancialCompletionEvidence.Tests/FinancialCompletionEvidence.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false \
            --results-directory TestResults/FinancialCompletion --logger 'trx;LogFileName=financial-completion.trx'
          python3 -B scripts/check_financial_completion_results.py
          dotnet test Legacy.Maliev.QuotationService.Tests/Legacy.Maliev.QuotationService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:GITHUB_ACTIONS=false --collect 'XPlat Code Coverage' --results-directory TestResults/CoverageGate \
            --settings Legacy.Maliev.QuotationService.Tests/coverage.runsettings \
            --logger 'trx;LogFileName=quotation-complete-coverage.trx'

      - name: Enforce 80 percent owned handwritten line coverage
        shell: bash
        run: |
          mapfile -t reports < <(find TestResults/CoverageGate -mindepth 2 -maxdepth 2 -type f -name coverage.cobertura.xml)
          if [[ "${#reports[@]}" -ne 1 ]]; then
            echo "Expected exactly one Cobertura report, found ${#reports[@]}." >&2
            exit 1
          fi
          python3 scripts/check_owned_coverage.py "${reports[0]}" --minimum 80
          python3 scripts/check_owned_coverage.py "${reports[0]}" --minimum 80 --raw

      - name: Retain complete coverage evidence
        if: always() && (hashFiles('TestResults/CoverageGate/quotation-complete-coverage.trx') != '' || hashFiles('TestResults/C821Verifier/c821-verifier.trx', 'TestResults/C821Recipient/c821-recipient.trx', 'TestResults/QualificationCustody/qualification-custody.trx', 'TestResults/C6SourceIndex/c6-source-index.trx', 'TestResults/AnalyticsLeaseReclaim/analytics-lease-reclaim.trx', 'TestResults/AnalyticsDeliverySettlement/analytics-delivery-settlement.trx') != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quotation-complete-coverage-${{ github.sha }}
          path: |
            TestResults/C6SourceIndex/c6-source-index.trx
            TestResults/C821Verifier/c821-verifier.trx
            TestResults/C821Recipient/c821-recipient.trx
            TestResults/QualificationCustody/qualification-custody.trx
            TestResults/AnalyticsLeaseReclaim/analytics-lease-reclaim.trx
            TestResults/AnalyticsDeliverySettlement/analytics-delivery-settlement.trx
            TestResults/CompanionAdmission/companion-admission.trx
            TestResults/CompanionSigning/companion-signing.trx
            TestResults/StorageFront/storage-front.trx
            TestResults/FinancialCompletion/financial-completion.trx
            TestResults/CoverageGate/quotation-complete-coverage.trx
            TestResults/CoverageGate/*/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false

      - name: Retain actual qualification wire-source evidence
        if: always() && hashFiles('TestResults/QualificationWire/qualification-wire.trx') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qualification-source-wire-${{ github.sha }}
          path: |
            TestResults/QualificationWire/qualification-wire.trx
            TestResults/QualificationWire/qualification-wire-receipt.json
            TestResults/QualificationWire/empty.json
            TestResults/QualificationWire/mixed.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false

      - name: Release exact owned image references
        if: always()
        timeout-minutes: 2
        shell: bash
        run: python3 -B scripts/registry_preload/preload_images.py cleanup
      - name: Retain registry custody evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quotation-registry-custody-${{ github.job }}-${{ github.sha }}
          path: ${{ runner.temp }}/quotation-registry-preload.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: false
