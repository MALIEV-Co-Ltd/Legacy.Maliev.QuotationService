version: 2
updates:
  - package-ecosystem: nuget
    # Scan only project graphs that resolve without the unpublished shared package.
    directories:
      - /Legacy.Maliev.QuotationService.Application
      - /Legacy.Maliev.QuotationService.Data
      - /Legacy.Maliev.QuotationService.Domain
      - /Legacy.Maliev.QuotationService.MigrationRunner
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: Legacy.Maliev.ServiceDefaults
      - dependency-name: Legacy.Maliev.CompatibilityContracts
      # EF/Npgsql must move with the pinned shared ServiceDefaults runtime graph.
      # Tracking: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults#30.
      - dependency-name: Microsoft.EntityFrameworkCore
      - dependency-name: Microsoft.EntityFrameworkCore.Abstractions
      - dependency-name: Microsoft.EntityFrameworkCore.Design
      - dependency-name: Microsoft.EntityFrameworkCore.Relational
      - dependency-name: Npgsql.EntityFrameworkCore.PostgreSQL
      # Redis 3.1.31 introduces server-8.4-specific analyzer guidance.
      - dependency-name: StackExchange.Redis
        versions: ["3.1.31"]
    groups:
      nuget-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /Legacy.Maliev.QuotationService.Api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
